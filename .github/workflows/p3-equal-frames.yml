name: P3 exact-frame comparison of three actor-critic implementations
on:
  push:
    paths:
      - "p3/equal_frame_comparison.py"
      - "tests/equal_frame_contract_test.py"
      - ".github/workflows/p3-equal-frames.yml"
  pull_request:
    paths:
      - "p3/equal_frame_comparison.py"
      - "tests/equal_frame_contract_test.py"
      - ".github/workflows/p3-equal-frames.yml"
permissions:
  contents: read
jobs:
  equal-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install "gymnasium==1.1.1" "numpy==1.26.4"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Test exact frame truncation, updates and seeded 3-way protocol
        run: python -m unittest discover -s tests -p "equal_frame_contract_test.py" -v
      - name: Train all three models with the same exact 320k frames across three seeds
        run: |
          python -m p3.equal_frame_comparison --frames 320000 --eval-episodes 64             --output build/p3-equal-frames.json --cost build/p3-equal-frames-cost.json
          python -m p3.equal_frame_comparison --frames 320000 --eval-episodes 64             --output build/p3-equal-frames-repeat.json --cost build/p3-equal-frames-cost-repeat.json
          cmp build/p3-equal-frames.json build/p3-equal-frames-repeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("build/p3-equal-frames.json").read_text())
          assert data["training_seeds"] == [2026,2027,2028]
          assert data["training_frames_per_seed_and_algorithm"] == 320000
          assert all(r["training_environment_steps"] == 320000
                     for rows in data["runs"].values() for r in rows)
          assert all(r["evaluation"]["trained_greedy"]["episodes"] == 64
                     for rows in data["runs"].values() for r in rows)
          print("P3_EXACT_FRAME_COMPARISON_PASS")
          PY
      - name: Upload raw three-seed scores and separate non-deterministic cost
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-three-model-exact-frame-comparison
          path: |
            build/p3-equal-frames.json
            build/p3-equal-frames-cost.json
          if-no-files-found: ignore
