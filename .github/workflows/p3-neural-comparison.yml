name: P3 controlled neural vs linear Actor-Critic comparison
on:
  push:
    paths:
      - "p3/**"
      - "tests/neural_contract_test.py"
      - ".github/workflows/p3-neural-comparison.yml"
  pull_request:
    paths:
      - "p3/**"
      - "tests/neural_contract_test.py"
      - ".github/workflows/p3-neural-comparison.yml"
permissions:
  contents: read
jobs:
  cpu-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned modern environment and explicit PyTorch CPU wheel
        run: |
          python -m pip install "gymnasium==1.1.1" "numpy==1.26.4"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Prove real gradients and seeded test contracts
        run: python -m unittest discover -s tests -p "neural_contract_test.py" -v
      - name: Same-environment three-seed comparison with runtime diagnostics
        run: |
          python -m p3.compare_models --output build/p3-model-comparison.json --timing-output build/p3-model-timing.json
          python -m p3.compare_models --output build/p3-model-comparison-repeat.json --timing-output build/p3-model-timing-repeat.json
          cmp build/p3-model-comparison.json build/p3-model-comparison-repeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("build/p3-model-comparison.json").read_text())
          assert p["seeds"] == [2026,2027,2028]
          assert all(x["actor_weight_l2_change"] > 0.0 and x["critic_weight_l2_change"] > 0.0
                     for x in p["runs"]["pytorch_neural"])
          assert len(p["summary"]["neural_minus_linear_by_seed"]) == 3
          print("MODEL_CHECK_OK three seeds, equal budgets, heldout scoring, real policy/value changes")
          PY
      - name: Upload reproducibility and non-deterministic cost measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-neural-vs-linear-evidence
          path: |
            build/p3-model-comparison.json
            build/p3-model-timing.json
          if-no-files-found: ignore
