name: P3 n-step cross-model RNG isolation audit
on:
  push:
    paths:
      - "p3/order_audit.py"
      - ".github/workflows/p3-order-audit.yml"
  pull_request:
    paths:
      - "p3/order_audit.py"
      - ".github/workflows/p3-order-audit.yml"
permissions:
  contents: read
jobs:
  rng-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU packages
        run: |
          python -m pip install "gymnasium==1.1.1" "numpy==1.26.4"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Compare seeded n-step runs before and after another trained model
        run: python -m p3.order_audit --output build/p3-rng-order-audit.json
      - name: Retain audit even if order sensitivity is detected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-cross-model-rng-order-audit
          path: build/p3-rng-order-audit.json
          if-no-files-found: ignore
