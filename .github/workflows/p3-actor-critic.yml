name: P3 CPU actor-critic learning benchmark
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small pinned CPU dependencies (no Torch or GPU)
        run: python -m pip install "gymnasium==1.1.1" "numpy==1.26.4"
      - name: Unit tests on real CartPole and parameter updates
        run: python -m unittest discover -s tests -p "test_p3_*.py" -v
      - name: Train, evaluate against random and check fixed-seed JSON reproducibility
        run: |
          python -m p3.cartpole_actor_critic --seed 2026 --train-episodes 480 --eval-episodes 64 --output build/p3-cartpole-actor-critic.json
          python -m p3.cartpole_actor_critic --seed 2026 --train-episodes 480 --eval-episodes 64 --output build/p3-cartpole-actor-critic-repeat.json
          cmp build/p3-cartpole-actor-critic.json build/p3-cartpole-actor-critic-repeat.json
          python - <<'PY'
          import json
          d=json.load(open("build/p3-cartpole-actor-critic.json"))
          final=d["evaluation"]["trained_greedy"]["mean_reward"]
          random=d["evaluation"]["random"]["mean_reward"]
          initial=d["evaluation"]["initial_greedy"]["mean_reward"]
          assert d["policy_weight_l2_change"]>0.01, "No real policy update"
          assert final > random+15, (initial,final,random)
          print(f"P3_RL_RESULT initial={initial} trained={final} random={random} episodes={d['evaluation_episodes']} weight_change={d['policy_weight_l2_change']}")
          PY
      - name: Run three independent precommitted seeds and compare exact JSON
        run: |
          python -m p3.benchmark --output build/p3-multiseed.json
          python -m p3.benchmark --output build/p3-multiseed-repeat.json
          cmp build/p3-multiseed.json build/p3-multiseed-repeat.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("build/p3-multiseed.json").read_text())
          assert d["seeds"] == [2026,2027,2028]
          assert all(r["policy_weight_l2_change"] > 0.01 for r in d["runs"])
          mean=d["summary"]["trained_minus_random"]["mean_gap"]
          assert mean > 30, f"multi-seed holdout advantage not established: {mean}"
          print("P3_RL_THREE_SEEDS", json.dumps({
            "seeds":d["seeds"],
            "trained":d["summary"]["trained_greedy"]["individual_seed_means"],
            "random":d["summary"]["random"]["individual_seed_means"],
            "trained_mean":d["summary"]["trained_greedy"]["mean_of_seed_means"],
            "trained_sample_sd":d["summary"]["trained_greedy"]["sample_sd_of_seed_means"],
            "mean_gap":mean,
          },sort_keys=True))
          PY
      - name: Upload real learning and evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: p3-cpu-actor-critic-evaluation
          path: |
            build/p3-cartpole-actor-critic.json
            build/p3-multiseed.json
