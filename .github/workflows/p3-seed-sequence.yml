name: P3 n-step previous-seed sequence isolation
on:
  push:
    paths:
      - "p3/seed_sequence_audit.py"
      - "tests/seed_sequence_contract_test.py"
      - ".github/workflows/p3-seed-sequence.yml"
  pull_request:
    paths:
      - "p3/seed_sequence_audit.py"
      - "tests/seed_sequence_contract_test.py"
      - ".github/workflows/p3-seed-sequence.yml"
permissions:
  contents: read
jobs:
  sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact CPU dependencies
        run: |
          python -m pip install "gymnasium==1.1.1" "numpy==1.26.4"
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Validate seed sequence checks
        run: python -m unittest discover -s tests -p "seed_sequence_contract_test.py" -v
      - name: Audit seed 2028 before and after 2026 and 2027 full training
        run: |
          python -m p3.seed_sequence_audit --frames 320000             --output build/p3-seed-sequence-audit.json
      - name: Keep complete report even on mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-nstep-previous-seed-order-report
          path: build/p3-seed-sequence-audit.json
          if-no-files-found: ignore
